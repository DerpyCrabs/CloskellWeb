<!doctype html>
<html lang="en">
  <head>
    <script>
      ;(function () {
        var theme = localStorage.getItem('better-swagger-theme') || localStorage.getItem('theme')
        if (theme === 'dark' || !theme) document.documentElement.classList.add('dark')
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Better Swagger UI ported to Closkell." />
    <meta name="theme-color" content="#111827" />
    <title>Better Swagger UI</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Better Swagger UI requires JavaScript.</noscript>
    <script type="module" src="/src/app.clsk"></script>
  </body>
</html>
